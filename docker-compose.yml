# Docker's json-file driver keeps logs forever by default. Data retention here
# is indefinite by design, so an uncapped log volume on the same disk is the
# thing most likely to fill a Raspberry Pi and take the stack down with it.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *logging
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    # Browsers reach the API through the frontend's /api proxy, so this port is
    # published on the loopback interface only. It is there for the interactive
    # docs at http://localhost:8000/docs and for tests run on the host; nothing
    # outside the machine needs it, and nothing outside the machine gets it.
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *logging
    depends_on:
      api:
        condition: service_healthy
    # The one origin a user has to expose and secure. Change HELIO_PORT to move
    # it; the image holds no absolute API URL, so nothing needs rebuilding.
    ports:
      - "${HELIO_PORT:-3000}:80"

volumes:
  pgdata:
