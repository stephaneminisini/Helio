name: CI

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@v5.4.2
        with:
          version: "0.6.14"

      - name: Cache uv packages
        uses: actions/cache@v4.2.3
        with:
          path: ~/.cache/uv
          key: uv-lint-${{ hashFiles('backend/uv.lock') }}
          restore-keys: uv-lint-

      - name: Install dependencies
        run: uv sync --extra dev --group dev

      - name: Check formatting
        run: uv run ruff format --check helio/ tests/

      - name: Lint
        run: uv run ruff check helio/ tests/

  backend-security:
    name: Backend Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@v5.4.2
        with:
          version: "0.6.14"

      - name: Cache uv packages
        uses: actions/cache@v4.2.3
        with:
          path: |
            ~/.cache/uv
            ~/.local/share/uv/tools
          key: uv-security-${{ hashFiles('backend/uv.lock') }}
          restore-keys: uv-security-

      - name: Run Bandit
        run: uvx bandit -r backend/helio/ -ll

      - name: Run Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: backend/
          severity: CRITICAL,HIGH
          exit-code: "1"
          format: table

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@v5.4.2
        with:
          version: "0.6.14"

      - name: Cache uv packages
        uses: actions/cache@v4.2.3
        with:
          path: ~/.cache/uv
          key: uv-test-${{ hashFiles('backend/uv.lock') }}
          restore-keys: uv-test-

      - name: Install dependencies
        run: uv sync --extra dev --group dev

      - name: Run tests
        run: uv run pytest tests/ -v --tb=short

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Setup Node
        uses: actions/setup-node@v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: ./node_modules/.bin/tsc --noEmit

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  frontend-e2e:
    name: Frontend Smoke Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: helio
          POSTGRES_PASSWORD: helio
          POSTGRES_DB: helio_e2e
        ports:
          - 5432:5432
        # Checked over TCP rather than the socket: the image's init scripts run
        # a socket-only server before the password is set, so a socket probe
        # reports ready while connections from the runner still fail.
        options: >-
          --health-cmd "pg_isready -h localhost -U helio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://helio:helio@localhost:5432/helio_e2e
      # The seeded system uses manual irradiance, so no NASA POWER call is made.
      IRRADIANCE_SOURCE: manual
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@v5.4.2
        with:
          version: "0.6.14"

      - name: Cache uv packages
        uses: actions/cache@v4.2.3
        with:
          path: ~/.cache/uv
          key: uv-e2e-${{ hashFiles('backend/uv.lock') }}
          restore-keys: uv-e2e-

      - name: Setup Node
        uses: actions/setup-node@v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --extra dev --group dev

      # A throwaway key per run: nothing encrypted with it outlives the job.
      - name: Generate a Fernet key
        working-directory: backend
        run: |
          KEY=$(uv run python -c \
            'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')
          echo "FERNET_KEY=$KEY" >> "$GITHUB_ENV"

      - name: Run migrations
        working-directory: backend
        run: uv run alembic upgrade head

      # Backgrounded rather than waited on: create-e2e-system.sh polls /api/health
      # until the API answers. The log is git-ignored (*.log) and uploaded on
      # failure, so a start-up crash is visible instead of just a timeout.
      - name: Start the API
        working-directory: backend
        run: |
          uv run uvicorn helio.main:app --host 127.0.0.1 --port 8000 \
            > api.log 2>&1 &

      - name: Create the smoke test system
        run: ./scripts/create-e2e-system.sh

      - name: Seed mock production data
        working-directory: backend
        run: uv run python -m helio.cli seed-mock

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        working-directory: frontend
        run: npm run e2e

      # The report and the API log are what turn a red run into a diagnosis:
      # traces and screenshots for the browser side, uvicorn output for the API.
      - name: Upload the failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
            backend/api.log
          retention-days: 7
          if-no-files-found: ignore
