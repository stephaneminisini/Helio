name: CI

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@v5.4.2
        with:
          version: "0.6.14"

      - name: Cache uv packages
        uses: actions/cache@v4.2.3
        with:
          path: ~/.cache/uv
          key: uv-lint-${{ hashFiles('backend/uv.lock') }}
          restore-keys: uv-lint-

      - name: Install dependencies
        run: uv sync --extra dev --group dev

      - name: Check formatting
        run: uv run ruff format --check helio/ tests/

      - name: Lint
        run: uv run ruff check helio/ tests/

  backend-security:
    name: Backend Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@v5.4.2
        with:
          version: "0.6.14"

      - name: Cache uv packages
        uses: actions/cache@v4.2.3
        with:
          path: |
            ~/.cache/uv
            ~/.local/share/uv/tools
          key: uv-security-${{ hashFiles('backend/uv.lock') }}
          restore-keys: uv-security-

      - name: Run Bandit
        run: uvx bandit -r backend/helio/ -ll

      - name: Run Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: backend/
          severity: CRITICAL,HIGH
          exit-code: "1"
          format: table

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@v5.4.2
        with:
          version: "0.6.14"

      - name: Cache uv packages
        uses: actions/cache@v4.2.3
        with:
          path: ~/.cache/uv
          key: uv-test-${{ hashFiles('backend/uv.lock') }}
          restore-keys: uv-test-

      - name: Install dependencies
        run: uv sync --extra dev --group dev

      - name: Run tests
        run: uv run pytest tests/ -v --tb=short

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Setup Node
        uses: actions/setup-node@v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: ./node_modules/.bin/tsc --noEmit

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
