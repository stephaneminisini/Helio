name: helio-monitor
region: nyc
services:
  - name: api
    github:
      repo: YOUR_USERNAME/helio-monitor
      branch: main
      deploy_on_push: true
    dockerfile_path: backend/Dockerfile
    http_port: 8000
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /api/health
      initial_delay_seconds: 20
      period_seconds: 30
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}
      - key: ENPHASE_CLIENT_ID
        scope: RUN_TIME
        type: SECRET
      - key: ENPHASE_CLIENT_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: ENPHASE_SYSTEM_ID
        scope: RUN_TIME
      - key: FERNET_KEY
        scope: RUN_TIME
        type: SECRET
      - key: NREL_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: IRRADIANCE_SOURCE
        scope: RUN_TIME
        value: nrel
      - key: TZ
        scope: RUN_TIME
        value: America/New_York
      - key: POLL_HOUR
        scope: RUN_TIME
        value: "4"

  - name: frontend
    github:
      repo: YOUR_USERNAME/helio-monitor
      branch: main
      deploy_on_push: true
    dockerfile_path: frontend/Dockerfile
    http_port: 80
    instance_count: 1
    instance_size_slug: basic-xxs
    envs:
      - key: VITE_API_BASE_URL
        scope: BUILD_TIME
        value: ${api.PUBLIC_URL}

databases:
  - name: db
    engine: PG
    version: "15"
    size: db-s-dev-database
    num_nodes: 1
